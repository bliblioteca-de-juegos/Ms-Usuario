server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ms-usuario
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/usuarios_db?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

jwt:
  secret: ${JWT_SECRET:VGhpcy1pcy1hLXNpbXBsZS1qd3Qtc2VjcmV0LWZvci1iaWJsaW90ZWNh}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

